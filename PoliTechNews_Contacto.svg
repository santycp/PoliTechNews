  <g id="Hero" transform="translate(64 124)"><rect width="1312" height="356" rx="30" fill="url(#b)"/><circle cx="1130" cy="44" r="170" fill="#1ED6D0" opacity=".12"/><g transform="translate(64 64)"><text y="20" font-family="Inter" font-size="13" font-weight="700" letter-spacing="1.5" fill="#31D8D1">HABLEMOS</text><text y="78" font-family="Poppins" font-size="44" font-weight="700" fill="#FFF">Conecta con PoliTechNews</text><text y="124" font-family="Inter" font-size="17" fill="#C7DAEA">¿Tienes una idea, una historia o una sugerencia?</text><text y="152" font-family="Inter" font-size="17" fill="#C7DAEA">Nuestro equipo quiere escucharte.</text><g transform="translate(0 202)" font-family="Inter" font-size="13"><rect width="184" height="46" rx="13" fill="#FFF" opacity=".10"/><circle cx="24" cy="23" r="8" fill="none" stroke="#31D8D1" stroke-width="2"/><path d="M18 20l6 5 7-7" fill="none" stroke="#31D8D1" stroke-width="2"/><text x="44" y="28" fill="#E1EEF7">Respuesta en 24–48 h</text><rect x="200" width="210" height="46" rx="13" fill="#FFF" opacity=".10"/><circle cx="224" cy="23" r="8" fill="none" stroke="#31D8D1" stroke-width="2"/><path d="M224 18v6l4 2" stroke="#31D8D1" stroke-width="2"/><text x="244" y="28" fill="#E1EEF7">Lunes a viernes · 8–5</text></g></g><g transform="translate(920 62)"><rect width="292" height="232" rx="24" fill="#FFF" opacity=".10" stroke="#FFF" stroke-opacity=".18"/><path d="M56 72h180v112H99l-43 32v-32z" fill="none" stroke="#FFF" stroke-width="5" stroke-linejoin="round"/><circle cx="105" cy="126" r="8" fill="#31D8D1"/><circle cx="146" cy="126" r="8" fill="#31D8D1"/><circle cx="187" cy="126" r="8" fill="#31D8D1"/></g></g>
