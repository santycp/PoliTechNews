  <g id="FAQ" transform="translate(96 1310)"><text y="30" font-family="Poppins" font-size="27" font-weight="700" fill="#071B3B">Preguntas frecuentes</text><g transform="translate(0 62)" font-family="Inter"><g filter="url(#s)"><rect width="392" height="116" rx="18" fill="#FFF"/><circle cx="42" cy="42" r="22" fill="#E5FAF8"/><text x="42" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#087E9B">?</text><text x="78" y="37" font-size="14" font-weight="700" fill="#24364C">¿Puedo proponer una noticia?</text><text x="78" y="65" font-size="12" fill="#718095">Sí, envíanos el tema y una breve descripción.</text></g><g transform="translate(428)" filter="url(#s)"><rect width="392" height="116" rx="18" fill="#FFF"/><circle cx="42" cy="42" r="22" fill="#EEF1FF"/><text x="42" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#4259C5">?</text><text x="78" y="37" font-size="14" font-weight="700" fill="#24364C">¿Cuándo recibiré respuesta?</text><text x="78" y="65" font-size="12" fill="#718095">Normalmente respondemos en 24–48 horas.</text></g><g transform="translate(856)" filter="url(#s)"><rect width="392" height="116" rx="18" fill="#FFF"/><circle cx="42" cy="42" r="22" fill="#FFF1E8"/><text x="42" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#9D5426">?</text><text x="78" y="37" font-size="14" font-weight="700" fill="#24364C">¿Puedo solicitar una corrección?</text><text x="78" y="65" font-size="12" fill="#718095">Claro. Indica el artículo y el dato a revisar.</text></g></g></g>
