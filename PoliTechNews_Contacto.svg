    <g id="Form" transform="translate(430 0)" filter="url(#s)"><rect width="818" height="720" rx="24" fill="#FFF"/><text x="34" y="50" font-family="Poppins" font-size="25" font-weight="700" fill="#071B3B">Envíanos un mensaje</text><text x="34" y="78" font-family="Inter" font-size="14" fill="#718095">Todos los campos marcados con * son obligatorios.</text><g transform="translate(34 114)" font-family="Inter"><g><text y="14" font-size="12" font-weight="700" fill="#44546A">NOMBRE COMPLETO *</text><rect y="30" width="360" height="52" rx="12" fill="#F8FAFC" stroke="#D9E2EE"/><text x="16" y="62" font-size="13" fill="#9AA5B4">Tu nombre</text></g><g transform="translate(390)"><text y="14" font-size="12" font-weight="700" fill="#44546A">CORREO ELECTRÓNICO *</text><rect y="30" width="360" height="52" rx="12" fill="#F8FAFC" stroke="#D9E2EE"/><text x="16" y="62" font-size="13" fill="#9AA5B4">nombre@correo.com</text></g><text y="124" font-size="12" font-weight="700" fill="#44546A">ASUNTO *</text><rect y="140" width="750" height="52" rx="12" fill="#F8FAFC" stroke="#D9E2EE"/><text x="16" y="172" font-size="13" fill="#718095">Selecciona una opción</text><path d="M716 159l6 7 6-7" fill="none" stroke="#718095" stroke-width="2"/><text y="234" font-size="12" font-weight="700" fill="#44546A">MENSAJE *</text><rect y="250" width="750" height="188" rx="12" fill="#F8FAFC" stroke="#D9E2EE"/><text x="16" y="284" font-size="13" fill="#9AA5B4">Cuéntanos cómo podemos ayudarte…</text><text x="700" y="420" font-size="11" fill="#A1ACB9">0 / 500</text><g transform="translate(0 466)"><rect width="20" height="20" rx="5" fill="#FFF" stroke="#BFCBDA"/><text x="34" y="15" font-size="12" fill="#607087">Acepto el tratamiento de mis datos para responder esta solicitud.</text></g><rect y="520" width="180" height="54" rx="14" fill="#0B3A72"/><text x="90" y="554" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">Enviar mensaje →</text><text x="204" y="553" font-size="12" fill="#8693A3">Recibirás