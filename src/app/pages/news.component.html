<app-banner eyebrow="ACTUALIDAD TECNOLÓGICA" title="Todas las noticias" description="Explora novedades, análisis y tendencias que conectan la tecnología con nuestra comunidad universitaria."><div class="banner-counter"><strong>{{ news.published().length }}</strong><span>artículos disponibles</span></div></app-banner>
<section class="container section"><form id="news-search" class="filter-panel" role="search" (ngSubmit)="search()"><div class="filter-row"><label class="visually-hidden" for="news-query">Buscar noticias</label><input id="news-query" name="query" type="search" placeholder="Buscar por título, categoría o palabra clave..." [(ngModel)]="searchText"><button type="submit" class="button button-navy">Buscar</button></div><div class="chip-row" aria-label="Filtrar por categoría">@for (c of categories; track c) { <button type="button" class="filter-chip" [class.selected]="category() === c" [attr.aria-pressed]="category() === c" (click)="filter(c)">{{ c }}</button> }</div></form>
  <div id="news-results" aria-live="polite"><div class="section-top results-heading"><div><h2>Últimas publicaciones</h2><p>{{ filtered().length }} noticias encontradas</p></div><span class="muted">Mostrando {{ shown().length }} de {{ filtered().length }}</span></div>
    @if (shown().length) { <div class="news-grid">@for (article of shown(); track article.id) { <app-news-card [article]="article" /> }</div><app-pagination [total]="totalPages()" [current]="currentPage()" (change)="goToPage($event)" /> }
    @else { <app-empty-state title="No encontramos noticias" description="Prueba otra palabra clave o cambia la categoría."><button class="button button-navy" (click)="clear()">Ver todas las noticias</button></app-empty-state> }
  </div>
</section>
