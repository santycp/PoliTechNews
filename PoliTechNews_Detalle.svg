    <g font-family="Inter" font-size="15" font-weight="600" fill="#44546A"><text x="674" y="55">Inicio</text><text x="754" y="55" fill="#0B3A72">Noticias</text><rect x="752" y="70" width="64" height="3" rx="1.5" fill="#1AC6C0"/><text x="850" y="55">Favoritos</text><text x="950" y="55">Gestionar</text><text x="1054" y="55">Contacto</text></g>
    <g transform="translate(1175 24)"><rect width="169" height="44" rx="12" fill="#0B3A72"/><text x="84.5" y="28" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#FFFFFF">Explorar noticias</text></g>
  </g>

  <!-- Breadcrumb and title -->
  <g id="ArticleHeader" transform="translate(96 132)">
    <text y="18" font-family="Inter" font-size="13" fill="#718095">Inicio  /  Noticias  /  Inteligencia Artificial</text>
    <rect y="55" width="166" height="30" rx="15" fill="#E5FAF8"/><text x="83" y="76" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#087E9B">INTELIGENCIA ARTIFICIAL</text>
    <text y="143" font-family="Poppins" font-size="48" font-weight="700" fill="#071B3B">La inteligencia artificial transforma</text>
    <text y="201" font-family="Poppins" font-size="48" font-weight="700" fill="#071B3B">los procesos de aprendizaje</text>
    <text y="249" font-family="Inter" font-size="19" fill="#607087">Nuevas herramientas abren oportunidades para personalizar la educación,</text>
    <text y="279" font-family="Inter" font-size="19" fill="#607087">fortalecer la investigación y potenciar la creatividad en las aulas.</text>
    <g transform="translate(0 318)" font-family="Inter">
      <circle cx="24" cy="24" r="24" fill="#0B3A72"/><text x="24" y="29" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">MC</text>
      <text x="62" y="19" font-size="14" font-weight="700" fill="#24364C">Mariana Castillo</text><text x="62" y="39" font-size="12" fill="#7B899A">Redacción PoliTechNews</text>
      <path d="M240 5V43" stroke="#D9E2EE"/><text x="262" y="20" font-size="13" fill="#607087">12 de septiembre de 2026</text><text x="262" y="40" font-size="12" fill="#8B98A9">Lectura de 5 minutos</text>
      <g transform="translate(950)"><rect width="202" height="48" rx="14" fill="#0B3A72"/><path d="M24 14c-7 0-12 5-12 12 0 12 12 18 12 18s12-6 12-18c0-7-5-12-12-12z" fill="none" stroke="#31D8D1" stroke-width="2"/><text x="54" y="30" font-size="14" font-weight="700" fill="#FFFFFF">Agregar a favoritos</text></g>
      <g transform="translate(1168)"><rect width="80" height="48" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/><path d="M29 30l22-12M29 20l22 12" stroke="#53647A" stroke-width="2"/><circle cx="26" cy="19" r="4" fill="#53647A"/><circle cx="54" cy="16" r="4" fill="#53647A"/><circle cx="54" cy="34" r="4" fill="#53647A"/></g>
    </g>
  </g>

  <!-- Hero visual -->
  <g id="ArticleVisual" transform="translate(96 534)" filter="url(#shadow)">
    <rect width="1248" height="480" rx="28" fill="url(#cover)"/>
    <circle cx="1080" cy="20" r="210" fill="#1ED6D0" opacity="0.12" filter="url(#blur)"/><circle cx="920" cy="500" r="170" fill="#5979FF" opacity="0.18" filter="url(#blur)"/>
    <g transform="translate(86 78)">
