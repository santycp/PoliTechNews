        <text x="24" y="42" font-family="Poppins" font-size="19" font-weight="700" fill="#071B3B">En resumen</text>
        <path d="M24 58H362" stroke="#E5EAF1"/>
        <g font-family="Inter" font-size="14" fill="#4D5E73"><circle cx="31" cy="87" r="4" fill="#1AC6C0"/><text x="48" y="92">La IA apoya procesos personalizados.</text><circle cx="31" cy="128" r="4" fill="#1AC6C0"/><text x="48" y="133">Facilita análisis e investigación.</text><circle cx="31" cy="169" r="4" fill="#1AC6C0"/><text x="48" y="174">Requiere uso ético y responsable.</text></g>
        <rect x="24" y="200" width="338" height="32" rx="10" fill="#EEF8F8"/><text x="193" y="221" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#087E9B">5 MINUTOS DE LECTURA</text>
      </g>
      <text y="310" font-family="Poppins" font-size="21" font-weight="700" fill="#071B3B">Noticias relacionadas</text>
      <g transform="translate(0 338)" filter="url(#shadow)">
        <rect width="386" height="154" rx="18" fill="#FFFFFF"/><rect width="128" height="154" rx="18" fill="url(#mini1)"/><path d="M30 90h67c13 0 24-9 24-21 0-11-9-21-21-21-5-12-21-17-33-10-8 5-13 13-15 22-13-2-25 7-25 20 0 4 1 7 3 10z" fill="#FFFFFF" opacity="0.9"/><text x="150" y="38" font-family="Inter" font-size="11" font-weight="700" fill="#4259C5">CLOUD</text><text x="150" y="69" font-family="Poppins" font-size="15" font-weight="700" fill="#071B3B">Campus conectados</text><text x="150" y="90" font-family="Poppins" font-size="15" font-weight="700" fill="#071B3B">desde la nube</text><text x="150" y="126" font-family="Inter" font-size="12" fill="#718095">4 min · Leer más →</text>
