      <rect x="28" y="28" width="374" height="64" rx="15" fill="#FFFFFF" opacity="0.11"/>
      <circle cx="58" cy="60" r="15" fill="#31D8D1"/><path d="M52 60l5 5 9-11" fill="none" stroke="#071B3B" stroke-width="3"/>
      <rect x="88" y="48" width="170" height="9" rx="4.5" fill="#FFFFFF" opacity="0.80"/><rect x="88" y="66" width="120" height="7" rx="3.5" fill="#A5C7DD" opacity="0.7"/>
      <rect x="28" y="116" width="178" height="164" rx="18" fill="#5979FF" opacity="0.74"/><path d="M56 244l38-50 30 27 42-65" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="224" y="116" width="178" height="164" rx="18" fill="#1ED6D0" opacity="0.82"/><circle cx="313" cy="198" r="45" fill="none" stroke="#071B3B" stroke-width="13" opacity="0.8"/><path d="M313 153a45 45 0 0137 19" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    </g>
    <g transform="translate(650 92)">
      <circle cx="210" cy="142" r="116" fill="#FFFFFF" opacity="0.08"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.92"><circle cx="210" cy="142" r="54"/><path d="M210 54v34M210 196v34M122 142h34M264 142h34M148 80l25 25M247 179l25 25M272 80l-25 25M173 179l-25 25"/></g>
      <g fill="#31D8D1"><circle cx="210" cy="42" r="8"/><circle cx="310" cy="142" r="8"/><circle cx="210" cy="242" r="8"/><circle cx="110" cy="142" r="8"/></g>
      <text x="210" y="302" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" letter-spacing="1.5" fill="#C8F7F3">TECNOLOGÍA + EDUCACIÓN</text>
    </g>
  </g>

  <!-- Main article content -->
  <g id="ArticleContent" transform="translate(96 1070)">
    <g id="Body" font-family="Inter" fill="#3F5065">
      <text x="0" y="26" font-family="Poppins" font-size="28" font-weight="700" fill="#071B3B">Una nueva etapa para la educación</text>
      <text x="0" y="72" font-size="16">La inteligencia artificial ya forma parte de múltiples experiencias académicas.</text>
      <text x="0" y="99" font-size="16">Asistentes de estudio, plataformas adaptativas y herramientas de análisis ayudan</text>
      <text x="0" y="126" font-size="16">a estudiantes y docentes a comprender mejor sus procesos de aprendizaje.</text>

      <text x="0" y="184" font-size="16">Su valor no está en reemplazar la labor humana, sino en ampliar las posibilidades:</text>
      <text x="0" y="211" font-size="16">ofrecer retroalimentación oportuna, identificar dificultades y facilitar el acceso</text>
      <text x="0" y="238" font-size="16">a recursos especializados desde distintos contextos y dispositivos.</text>

      <g transform="translate(0 278)">
        <rect width="814" height="158" rx="20" fill="#EAF8F8"/><rect width="6" height="158" rx="3" fill="#1AC6C0"/>
        <text x="34" y="43" font-family="Poppins" font-size="20" font-weight="700" fill="#075D70">“La tecnología es más valiosa cuando ayuda</text>
        <text x="34" y="72" font-family="Poppins" font-size="20" font-weight="700" fill="#075D70">a formular mejores preguntas, no solamente</text>
        <text x="34" y="101" font-family="Poppins" font-size="20" font-weight="700" fill="#075D70">cuando entrega respuestas rápidas.”</text>
        <text x="34" y="132" font-size="13" font-weight="700" fill="#54818B">LABORATORIO DE INNOVACIÓN EDUCATIVA</text>
      </g>

      <text x="0" y="490" font-family="Poppins" font-size="28" font-weight="700" fill="#071B3B">Tres oportunidades para la comunidad</text>
      <g transform="translate(0 528)">
        <circle cx="18" cy="18" r="18" fill="#0B3A72"/><text x="18" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
        <text x="52" y="15" font-size="16" font-weight="700" fill="#24364C">Aprendizaje personalizado</text><text x="52" y="41" font-size="15">Rutas, ejercicios y contenidos ajustados a necesidades concretas.</text>
      </g>
      <g transform="translate(0 600)">
        <circle cx="18" cy="18" r="18" fill="#0B3A72"/><text x="18" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
        <text x="52" y="15" font-size="16" font-weight="700" fill="#24364C">Investigación más ágil</text><text x="52" y="41" font-size="15">Organización de fuentes, exploración de datos y apoyo metodológico.</text>
      </g>
      <g transform="translate(0 672)">
        <circle cx="18" cy="18" r="18" fill="#0B3A72"/><text x="18" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
        <text x="52" y="15" font-size="16" font-weight="700" fill="#24364C">Nuevas formas de crear</text><text x="52" y="41" font-size="15">Prototipos, simulaciones y experiencias digitales más interactivas.</text>
      </g>
      <text x="0" y="786" font-size="16">El desafío será usar estas herramientas con criterio, transparencia y respeto por</text>
      <text x="0" y="813" font-size="16">la privacidad. La alfabetización digital y el pensamiento crítico seguirán siendo</text>
      <text x="0" y="840" font-size="16">esenciales para construir una innovación verdaderamente responsable.</text>

      <g transform="translate(0 892)">
        <rect width="814" height="118" rx="20" fill="#FFFFFF" stroke="#DCE4EE"/>
        <circle cx="64" cy="59" r="36" fill="#0B3A72"/><text x="64" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">MC</text>
        <text x="118" y="44" font-size="15" font-weight="700" fill="#24364C">Mariana Castillo</text><text x="118" y="68" font-size="13" fill="#6F7E91">Periodista universitaria · Tecnología y educación</text>
        <text x="118" y="91" font-size="12" fill="#8B98A9">Redacción PoliTechNews</text>
      </g>
    </g>

    <!-- Sidebar -->
