        <rect width="386" height="154" rx="18" fill="#FFFFFF"/><rect width="128" height="154" rx="18" fill="url(#mini2)"/><g transform="translate(22 40)" fill="none" stroke="#FFFFFF" stroke-width="4"><ellipse cx="42" cy="20" rx="34" ry="12"/><ellipse cx="42" cy="42" rx="34" ry="12"/><ellipse cx="42" cy="64" rx="34" ry="12"/><path d="M8 20v44M76 20v44"/></g><text x="150" y="38" font-family="Inter" font-size="11" font-weight="700" fill="#6641A4">DATOS</text><text x="150" y="69" font-family="Poppins" font-size="15" font-weight="700" fill="#071B3B">Datos abiertos e</text><text x="150" y="90" font-family="Poppins" font-size="15" font-weight="700" fill="#071B3B">investigación</text><text x="150" y="126" font-family="Inter" font-size="12" fill="#718095">6 min · Leer más →</text>
      </g>
      <g transform="translate(0 690)" filter="url(#shadow)">
        <rect width="386" height="154" rx="18" fill="#FFFFFF"/><rect width="128" height="154" rx="18" fill="url(#mini3)"/><path d="M64 26l35 14v25c0 26-15 45-35 58-20-13-35-32-35-58V40z" fill="#FFFFFF" opacity="0.9"/><path d="M49 70l11 11 20-23" fill="none" stroke="#A44B22" stroke-width="5"/><text x="150" y="38" font-family="Inter" font-size="11" font-weight="700" fill="#9D5426">CIBERSEGURIDAD</text><text x="150" y="69" font-family="Poppins" font-size="15" font-weight="700" fill="#071B3B">Cuida tu identidad</text><text x="150" y="90" font-family="Poppins" font-size="15" font-weight="700" fill="#071B3B">digital</text><text x="150" y="126" font-family="Inter" font-size="12" fill="#718095">5 min · Leer más →</text>
      </g>
    </g>
  </g>

  <!-- CTA and footer -->
  <g id="Newsletter" transform="translate(96 1928)">
    <rect width="1248" height="108" rx="22" fill="#0B3A72"/><text x="36" y="46" font-family="Poppins" font-size="20" font-weight="700" fill="#FFFFFF">¿Quieres recibir las próximas historias?</text><text x="36" y="72" font-family="Inter" font-size="13" fill="#BAD1E3">Mantente conectado con la actualidad tecnológica universitaria.</text><rect x="989" y="27" width="223" height="54" rx="14" fill="#1ED6D0"/><text x="1100" y="61" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#071B3B">Explorar más noticias →</text>
