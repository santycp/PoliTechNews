    <linearGradient id="mini1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D326D"/><stop offset="1" stop-color="#6682FF"/></linearGradient>
    <linearGradient id="mini2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#552A85"/><stop offset="1" stop-color="#A77AE7"/></linearGradient>
