      <text x="22" y="328" font-family="Inter" font-size="14" fill="#607087">Acceso seguro a laboratorios virtuales</text><text x="22" y="349" font-family="Inter" font-size="14" fill="#607087">y recursos académicos desde cualquier lugar.</text>
      <path d="M22 380H370" stroke="#E7ECF3"/><text x="22" y="412" font-family="Inter" font-size="12" fill="#7C899B">Hoy · 4 min</text><text x="296" y="412" font-family="Inter" font-size="13" font-weight="700" fill="#0B3A72">Leer más →</text>
