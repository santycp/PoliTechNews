      <g transform="translate(119 30)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"><circle cx="75" cy="74" r="54"/><path d="M75 20v108M21 74h108M37 37c23 20 53 20 76 0M37 111c23-20 53-20 76 0"/></g>
      <rect x="22" y="202" width="112" height="26" rx="13" fill="#EAF3FF"/><text x="78" y="220" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="#225A93">INNOVACIÓN</text>
      <text x="22" y="266" font-family="Poppins" font-size="20" font-weight="700" fill="#071B3B">Tecnología con impacto</text><text x="22" y="292" font-family="Poppins" font-size="20" font-weight="700" fill="#071B3B">social y ambiental</text>
      <text x="22" y="328" font-family="Inter" font-size="14" fill="#607087">Proyectos estudiantiles que responden</text><text x="22" y="349" font-family="Inter" font-size="14" fill="#607087">a desafíos reales de nuestras comunidades.</text>
