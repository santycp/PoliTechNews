      <text x="22" y="266" font-family="Poppins" font-size="20" font-weight="700" fill="#071B3B">Protege tu identidad digital</text><text x="22" y="292" font-family="Poppins" font-size="20" font-weight="700" fill="#071B3B">dentro y fuera del campus</text>
      <text x="22" y="328" font-family="Inter" font-size="14" fill="#607087">Claves sencillas para reconocer riesgos,</text><text x="22" y="349" font-family="Inter" font-size="14" fill="#607087">evitar fraudes y cuidar tus cuentas.</text>
      <path d="M22 380H370" stroke="#E7ECF3"/><text x="22" y="412" font-family="Inter" font-size="12" fill="#7C899B">9 sep · 5 min</text><text x="296" y="412" font-family="Inter" font-size="13" font-weight="700" fill="#0B3A72">Leer más →</text>
