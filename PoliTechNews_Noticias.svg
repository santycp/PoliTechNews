      <g transform="translate(110 36)"><path d="M38 90h104c20 0 36-14 36-32 0-18-14-32-32-33-8-19-33-27-52-15-12 7-20 19-23 33-20-3-39 11-39 31 0 6 2 11 6 16z" fill="#FFFFFF" opacity="0.9"/><path d="M75 116h60M89 135h32" stroke="#31D8D1" stroke-width="7" stroke-linecap="round"/></g>
