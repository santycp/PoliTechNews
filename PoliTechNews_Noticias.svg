      <path d="M0 22Q0 0 22 0H370Q392 0 392 22V180H0Z" fill="url(#g1)"/>
      <g transform="translate(145 38)" fill="none" stroke="#FFFFFF" stroke-width="3"><circle cx="50" cy="50" r="27"/><path d="M50 8v15M50 77v15M8 50h15M77 50h15M21 21l11 11M68 68l11 11M79 21L68 32M32 68L21 79"/></g>
