      <text x="22" y="266" font-family="Poppins" font-size="20" font-weight="700" fill="#071B3B">Interfaces accesibles:</text><text x="22" y="292" font-family="Poppins" font-size="20" font-weight="700" fill="#071B3B">diseñar para todas las personas</text>
